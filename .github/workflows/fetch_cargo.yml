name: Fetch Cargo Auto Daily

on:
  schedule:
    # รันอัตโนมัติ 3 เวลา (เวลาไทย): 08:00 น., 12:00 น., 18:00 น.
    - cron: '0 1,5,11 * * *'
  workflow_dispatch: # ปุ่มสำหรับกดรันเองแบบ Manual จากหน้าเว็บ

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas playwright openpyxl

    - name: Install Playwright Browsers & Dependencies
      run: |
        python -m playwright install chromium
        python -m playwright install-deps

    - name: Run Scraper Script
      env:
        CARGO_USERNAME: ${{ secrets.CARGO_USERNAME }}
        CARGO_PASSWORD: ${{ secrets.CARGO_PASSWORD }}
      run: |
        python fetch_cargo.py

    - name: Commit and Push Updated Excel
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *.xlsx
        git commit -m "Auto-update cargo excel data [skip ci]" || exit 0
        git push